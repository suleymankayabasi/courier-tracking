services:
  courier-tracking:
    build: .
    image: courier-tracking:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
